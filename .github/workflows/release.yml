name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write              # required for npm trusted publishing OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    # Optionally gate on a GitHub environment named "npm" — adds a manual approval
    # step before publish runs. Configure under repo Settings → Environments → npm.
    # environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          registry-url: 'https://registry.npmjs.org'
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
      # Trusted publishing requires npm >= 11.5.1. Node 22's bundled npm may lag,
      # and `npm install -g npm@latest` has a known self-upgrade race on hosted
      # runners — use npx so we don't mutate the global install.
      - run: npx -y npm@latest publish --provenance --access public
