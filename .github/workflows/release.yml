name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write              # required for npm trusted publishing OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    # Optionally gate on a GitHub environment named "npm" — adds a manual approval
    # step before publish runs. Configure under repo Settings → Environments → npm.
    # environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing requires npm >= 11.5.1. Node 22's bundled npm may lag.
      - run: npm install -g npm@latest
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
      # npm CLI 11.5.1+ exchanges the GitHub OIDC token for a publish credential.
      # No NPM_TOKEN secret needed — trust is configured on npmjs.com.
      - run: npm publish --provenance --access public
